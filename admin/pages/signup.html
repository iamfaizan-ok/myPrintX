<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Owner Registration — PrintX Admin Hub</title>
  <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body style="background-color: var(--bg-subtle); display: flex; align-items: center; justify-content: center; padding: 40px 16px;">

  <div class="card" style="max-width: 560px; width: 100%; margin: 0 auto; box-shadow: var(--shadow-md);">
    
    <div class="text-center mb-4">
      <div class="sidebar-brand justify-center" style="color: var(--primary); font-size: 1.5rem; justify-content: center;">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
          <path d="M6 14h12v8H6z"/>
        </svg>
        Welcome to PrintX
      </div>
      <h2 style="font-size: 1.25rem; font-weight: 700; margin-top: 8px;">For Shop Owners — Register</h2>
      <p style="font-size: 0.875rem; color: var(--text-muted); margin-top: 4px;">
        Use PrintX for easy shop management and save your valuable time.
      </p>
    </div>

    <!-- Alert Container -->
    <div id="signup-alert-container"></div>

    <form id="signup-form">
      <div style="font-size: 0.875rem; font-weight: 700; text-transform: uppercase; color: var(--primary); letter-spacing: 0.5px; margin-bottom: 12px; border-bottom: 1px solid var(--border-subtle); padding-bottom: 4px;">
        1. Shop Owner Credentials
      </div>

      <div class="form-group">
        <label class="form-label" for="owner_name">Owner Full Name *</label>
        <input type="text" id="owner_name" class="form-control" placeholder="Enter full name" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Business Email Address *</label>
        <input type="email" id="email" class="form-control" placeholder="Enter business email" required>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
        <div class="form-group">
          <label class="form-label" for="password">Password *</label>
          <div style="position: relative;">
            <input type="password" id="password" class="form-control" placeholder="Min. 6 chars" required minlength="6">
            <button type="button" id="toggle-pw" style="position: absolute; right: 10px; top: 10px; background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 0.75rem;">Show</button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm_password">Confirm Password *</label>
          <input type="password" id="confirm_password" class="form-control" placeholder="Re-enter password" required minlength="6">
        </div>
      </div>

      <div style="font-size: 0.875rem; font-weight: 700; text-transform: uppercase; color: var(--primary); letter-spacing: 0.5px; margin: 20px 0 12px 0; border-bottom: 1px solid var(--border-subtle); padding-bottom: 4px;">
        2. Print Shop Information
      </div>

      <div class="form-group">
        <label class="form-label" for="shop_name">Shop / Business Name *</label>
        <input type="text" id="shop_name" class="form-control" placeholder="Enter shop name" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="shop_phone">Shop Contact Phone *</label>
        <input type="tel" id="shop_phone" class="form-control" placeholder="e.g. +92 300 1234567" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="shop_address">Shop Physical Address *</label>
        <input type="text" id="shop_address" class="form-control" placeholder="Enter shop address" required>
      </div>

      <button type="submit" id="submit-signup-btn" class="btn btn-primary" style="width: 100%; height: 44px; font-size: 0.95rem; margin-top: 16px;">
        Register Shop & Generate Account
      </button>
    </form>

    <div class="text-center mt-4" style="border-top: 1px solid var(--border-subtle); padding-top: 16px;">
      <span style="font-size: 0.875rem; color: var(--text-secondary);">Already have an admin account?</span>
      <a href="/admin/pages/login.html" style="font-size: 0.875rem; font-weight: 600; color: var(--primary); margin-left: 6px;">Sign In Here</a>
    </div>

  </div>

  <script src="/admin/js/config.js"></script>
  <script src="/admin/js/api.js"></script>
  <script src="/admin/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (AdminAuth.isAuthenticated()) {
        window.location.href = '/admin/index.html';
        return;
      }

      const form = document.getElementById('signup-form');
      const submitBtn = document.getElementById('submit-signup-btn');
      const alertContainer = document.getElementById('signup-alert-container');
      const togglePw = document.getElementById('toggle-pw');
      const pwInput = document.getElementById('password');

      if (togglePw && pwInput) {
        togglePw.addEventListener('click', () => {
          if (pwInput.type === 'password') {
            pwInput.type = 'text';
            togglePw.textContent = 'Hide';
          } else {
            pwInput.type = 'password';
            togglePw.textContent = 'Show';
          }
        });
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertContainer.innerHTML = '';

        const name = document.getElementById('owner_name').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirm_password = document.getElementById('confirm_password').value;
        const shop_name = document.getElementById('shop_name').value.trim();
        const shop_phone = document.getElementById('shop_phone').value.trim();
        const shop_address = document.getElementById('shop_address').value.trim();

        if (password !== confirm_password) {
          alertContainer.innerHTML = '<div class="alert alert-error">Passwords do not match. Please re-enter.</div>';
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Registering Shop...';

        try {
          const res = await AdminApi.auth.signup({
            name,
            email,
            password,
            confirm_password,
            shop_name,
            shop_phone,
            shop_address
          });

          if (res && res.success && res.data) {
            AdminAuth.setSession(res.data.token, res.data.user, res.data.shop);
            window.location.href = '/admin/index.html';
          } else {
            throw new Error((res && res.message) || 'Registration failed.');
          }
        } catch (err) {
          let errorMsg = err.message || '';
          if (!errorMsg || errorMsg.includes('success: false') || errorMsg.includes('Request failed')) {
            errorMsg = 'Registration could not be completed. Please check the entered details.';
          }
          alertContainer.innerHTML = `<div class="alert alert-error">${escapeHTML(errorMsg)}</div>`;
          submitBtn.disabled = false;
          submitBtn.textContent = 'Register Shop & Generate Account';
        }
      });
    });
  </script>
</body>
</html>
